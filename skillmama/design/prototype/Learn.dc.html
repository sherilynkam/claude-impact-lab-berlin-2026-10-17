<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Learn to build a skill</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=DM+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#6A4BD6}a:hover{color:#4F35B0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #F2ECFF 0%, #EFE9FF 50%, #EADFFF 100%); font-family: 'DM Sans', sans-serif; color: #241B3A; display: flex; flex-direction: column; padding: 52px 20px 24px; gap: 16px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Library.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #241B3A">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="font-size: 14px; font-weight: 600; color: #5A3FC4">Skill school</div>
  </div>
  <h1 style="margin: 0; padding: 0 4px; font-family: Outfit, sans-serif; font-weight: 700; font-size: 28px; line-height: 1.15; letter-spacing: -0.01em">Build your first skill in 3 minutes</h1>

  <div style="border-radius: 22px; overflow: hidden; background: #FFFFFF; box-shadow: 0 10px 26px rgba(115,70,210,0.16)">
    <div style="height: 168px; background: linear-gradient(135deg, #7357DF 0%, #8A4FD8 60%, #B37BE8 100%); display: flex; align-items: center; justify-content: center; position: relative">
      <button aria-label="Play video" style="width: 64px; height: 64px; border-radius: 999px; border: none; background: #FFFFFF; color: #6A4BD6; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 20px rgba(36,27,58,0.25)">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
      </button>
      <div style="position: absolute; bottom: 12px; right: 12px; background: rgba(36,27,58,0.6); color: #FFFFFF; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 4px 10px">3:00 · subtitles</div>
      <div style="position: absolute; top: 12px; left: 12px; background: rgba(255,255,255,0.22); color: #FFFFFF; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 4px 10px">Video</div>
    </div>
    <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
      <div style="font-family: Outfit, sans-serif; font-weight: 600; font-size: 17px">What's a skill, and how do I make one?</div>
      <div style="font-size: 14px; color: #4E4A66">Watch with the sound off. Works one-handed.</div>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 4px 4px 0">
    <div style="font-family: Outfit, sans-serif; font-weight: 600; font-size: 18px">Listen while you feed</div>
    <div style="font-size: 13px; color: #4E4A66">3 short episodes</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{episodes}}" as="ep" hint-placeholder-count="3">
      <a href="Player.dc.html" style="text-decoration: none; color: #241B3A; background: #FFFFFF; border-radius: 18px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; min-height: 44px">
        <div style="width: 40px; height: 40px; border-radius: 999px; background: #ECE5FF; color: #5A3FC4; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
          <div style="font-weight: 600; font-size: 15px">{{ep.title}}</div>
          <div style="font-size: 13px; color: #4E4A66">{{ep.meta}}</div>
        </div>
      </a>
    </sc-for>
  </div>

  <div style="flex-grow: 1"></div>
  <div style="display: flex; gap: 10px">
    <a href="Templates.dc.html" style="flex: 1; height: 54px; border-radius: 999px; background: linear-gradient(90deg, #7357DF, #8A4FD8); color: #FFFFFF; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">Pick a template</a>
    <a href="CreateSkill.dc.html" style="flex: 1; height: 54px; border-radius: 999px; background: #FFFFFF; color: #5A3FC4; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">Start from scratch</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      episodes: [
        { title: '1 · Say what you need', meta: 'Audio · 2 min' },
        { title: '2 · Tell Claude how to answer', meta: 'Audio · 3 min' },
        { title: '3 · Test it and make it yours', meta: 'Audio · 2 min' }
      ]
    };
  }
}
</script>
</body>
</html>
