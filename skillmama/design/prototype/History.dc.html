<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Our journey</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=DM+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#6A4BD6}a:hover{color:#4F35B0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #F2ECFF 0%, #EFE9FF 50%, #EADFFF 100%); font-family: 'DM Sans', sans-serif; color: #241B3A; display: flex; flex-direction: column">
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 52px 20px 16px">
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px">
      <h1 style="margin: 0; font-family: Outfit, sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.01em">Our journey</h1>
      <p style="margin: 0; font-size: 15px; color: #4E4A66">Everything you and Mila tried together</p>
    </div>

    <div style="background: linear-gradient(135deg, #7357DF, #8A4FD8); color: #FFFFFF; border-radius: 22px; padding: 18px; display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 14px">This week</div>
        <div style="font-family: Outfit, sans-serif; font-weight: 700; font-size: 26px">4 activities</div>
      </div>
      <div style="font-size: 14px; text-align: right; line-height: 1.4">Mostly grasping<br>and sound</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{entries}}" as="e" hint-placeholder-count="4">
        <div style="background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; gap: 12px; align-items: center">
          <div style="width: 10px; height: 10px; border-radius: 999px; background: #7357DF; flex-shrink: 0"></div>
          <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
            <div style="font-weight: 600; font-size: 16px">{{e.title}}</div>
            <div style="font-size: 13px; color: #4E4A66">{{e.when}}</div>
          </div>
          <span style="{{e.badgeStyle}}">{{e.reaction}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <nav style="height: 78px; background: rgba(255,255,255,0.92); border-top: 1px solid #E2DEF5; display: flex; justify-content: space-around; align-items: center; padding-bottom: 8px">
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6B6280; font-size: 12px; font-weight: 500; min-width: 64px; padding: 6px 0">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Today</a>
    <a href="Library.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6B6280; font-size: 12px; font-weight: 500; min-width: 64px; padding: 6px 0">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><path d="M17.5 14v7M14 17.5h7"></path></svg>Skills</a>
    <a href="History.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6A4BD6; font-size: 12px; font-weight: 600; min-width: 64px; padding: 6px 0">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Journey</a>
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6B6280; font-size: 12px; font-weight: 500; min-width: 64px; padding: 6px 0">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Baby</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const styles = {
      loved: 'font-size: 12px; font-weight: 600; border-radius: 999px; padding: 5px 10px; background: #ECE5FF; color: #4F35B0;',
      okay: 'font-size: 12px; font-weight: 600; border-radius: 999px; padding: 5px 10px; background: #F3F1F7; color: #4E4A66;',
      notyet: 'font-size: 12px; font-weight: 600; border-radius: 999px; padding: 5px 10px; background: #FFF4DE; color: #5C3D00;'
    };
    const entries = [
      { title: 'Basket with known objects', when: 'Today', r: 'loved', reaction: 'Loved it' },
      { title: 'Grasping beads', when: 'Yesterday', r: 'loved', reaction: 'Loved it' },
      { title: 'Interlocking rings', when: 'Monday', r: 'okay', reaction: 'Okay' },
      { title: 'Bell on a ribbon', when: 'Last Friday', r: 'notyet', reaction: 'Not yet' }
    ];
    return { entries: entries.map((e) => ({ ...e, badgeStyle: styles[e.r] })) };
  }
}
</script>
</body>
</html>
